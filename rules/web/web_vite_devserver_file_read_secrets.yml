title: Vite Dev Server File-Read Bypass Aimed at Secrets
id: f25e7ef5-6c16-4e0d-bcee-d0d30d43e2b2
status: experimental
description: |
    The Vite bypass markers combined with a target that holds secrets or proves
    arbitrary file read: .env files, /etc/passwd, win.ini, or Vite's /@fs/
    absolute-path prefix. This is the exploitation attempt, not just probing.
references:
    - https://github.com/vitejs/vite/security/advisories/GHSA-x574-m823-4x7w
    - https://github.com/vitejs/vite/security/advisories/GHSA-4r4m-qw57-chr8
    - https://nvd.nist.gov/vuln/detail/CVE-2025-31486
author: Daniel F. Brown (Brown Cyber Services)
license: DRL-1.1
date: 2026-11-06
tags:
    - attack.initial-access
    - attack.t1190
    - attack.credential-access
    - attack.t1552.001
    - cve.2025-30208
    - cve.2025-31125
    - cve.2025-31486
logsource:
    category: webserver
detection:
    bypass_marker:
        cs-uri-query|contains:
            - 'raw\?\?'
            - 'import&raw'
            - 'raw\?import'
            - 'raw&import'
            - 'inline&import'
            - 'import&\?inline'
            - 'import&url&inline'
            - '.wasm\?init'
            - '.svg\?.wasm'
    plain_raw:
        cs-uri-query: 'raw'      # plain ?raw is not a bypass, but on .env it is a probe
    secret_target:
        - cs-uri-stem|endswith:
            - '/.env'
            - '/.env.local'
            - '/.env.production'
            - '/etc/passwd'
            - '/win.ini'
        - cs-uri-stem|contains: '/@fs/'
    condition: (bypass_marker or plain_raw) and secret_target
falsepositives:
    - Unlikely. A developer testing their own exposed dev server against these
      advisories.
level: high
