title: AI Crawler User-Agent Requesting Secret Files
id: b4fce732-fce7-4b16-ac93-6bff4d0cd520
status: experimental
description: |
    A request that claims to be an AI or search crawler asks for a path that holds
    secrets or source control data. Crawlers fetch pages they find through links
    and sitemaps; they have no reason to request these paths unprompted. One
    matching request is a scanner wearing a crawler's name, regardless of rotation.
references:
    - https://browncyber.com/research/uqscan-one-pipeline
author: Daniel F. Brown (Brown Cyber Services)
license: DRL-1.1
date: 2026-11-05
tags:
    - attack.reconnaissance
    - attack.t1595.003
    - attack.credential-access
    - attack.t1552.001
logsource:
    category: webserver
detection:
    crawler:
        cs-user-agent|contains:
            - 'GPTBot'
            - 'ChatGPT-User'
            - 'OAI-SearchBot'
            - 'ClaudeBot'
            - 'Claude-User'
            - 'Claude-SearchBot'
            - 'anthropic-ai'
            - 'PerplexityBot'
            - 'Perplexity-User'
            - 'Bytespider'
            - 'CCBot'
            - 'cohere-ai'
            - 'DeepSeekBot'
            - 'Kimi-SearchBot'
            - 'Bravebot'
            - 'meta-externalagent'
            - 'meta-externalfetcher'
            - 'Baiduspider'
            - 'Googlebot'
            - 'bingbot'
    secret_path:
        cs-uri-stem|endswith:
            - '/.env'
            - '/.git/config'
            - '/.git/HEAD'
            - '/config.json'
            - '/backup.zip'
            - '/.aws/credentials'
    condition: crawler and secret_path
falsepositives:
    - A public page that links to one of these paths, which a real crawler would then follow.
level: high
